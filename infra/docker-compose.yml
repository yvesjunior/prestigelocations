# Base commune dev/prod — aucun port publié ici (voir les overlays .dev / .prod).
# Toujours lancer depuis la racine du dépôt :
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up

name: prestige-locations

services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-}
        VITE_THEME_TWEAKER: ${VITE_THEME_TWEAKER:-}
        VITE_IMAGEKIT_URL_ENDPOINT: ${VITE_IMAGEKIT_URL_ENDPOINT:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-prestige}:${POSTGRES_PASSWORD:-prestige}@db:5432/${POSTGRES_DB:-prestige}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_FOLDER: ${IMAGEKIT_FOLDER:-prestigelocations}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
      # Mode du site : basic (défaut) ou advanced. Lu au runtime (redémarrer suffit).
      SITE_MODE: ${SITE_MODE:-basic}
      # Indice de connexion démo (=1 affiche les identifiants sur /admin/login). Dev/test seulement.
      DEV_LOGIN_HINT: ${DEV_LOGIN_HINT:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/fr"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prestige}
      POSTGRES_USER: ${POSTGRES_USER:-prestige}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prestige}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prestige} -d ${POSTGRES_DB:-prestige}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
