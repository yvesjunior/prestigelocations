# Base commune dev/prod — service `web` UNIQUEMENT (aucun conteneur `db`, aucun
# port publié : voir les overlays .dev / .prod).
#
#   • dev  : base + overlay .dev  → ajoute le conteneur `db` + les ports publiés
#   • prod : overlay .prod SEUL   → web seul, connecté au Postgres de l'hôte
#
# Ne JAMAIS lancer ce fichier seul : web n'a pas de base de données sans overlay.
#   docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up

name: prestige-locations

services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-}
        VITE_THEME_TWEAKER: ${VITE_THEME_TWEAKER:-}
        VITE_IMAGEKIT_URL_ENDPOINT: ${VITE_IMAGEKIT_URL_ENDPOINT:-}
    restart: unless-stopped
    environment:
      # Défaut = conteneur `db` de l'overlay dev. En prod l'overlay .prod remplace
      # ce DATABASE_URL par le Postgres de l'hôte.
      DATABASE_URL: postgres://${POSTGRES_USER:-prestige}:${POSTGRES_PASSWORD:-prestige}@db:5432/${POSTGRES_DB:-prestige}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_FOLDER: ${IMAGEKIT_FOLDER:-prestigelocations}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
      # Mode du site : basic (défaut) ou advanced. Lu au runtime (redémarrer suffit).
      SITE_MODE: ${SITE_MODE:-basic}
      # Environnement : dev = aides de test (ex. identifiants sur /admin/login). Défaut prod.
      ENV: ${ENV:-prod}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/fr"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
